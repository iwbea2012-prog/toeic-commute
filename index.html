let mem=null;

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function streak(){const s=st();let n=0;const d=new Date();if(!s.days[today()])d.setDate(d.getDate()-1);
 for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(s.days[k]>0){n++;d.setDate(d.getDate()-1)}else break}return n}

async function loadDaily(){

let voices=[];function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}
loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
let run=0;
function stopAll(){run++;try{speechSynthesis.cancel()}catch(e){}}
function say(text,lang,pitch){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=lang||"en-US";u.rate=(lang==="ja-JP"?1.05:st().set.rate);u.pitch=pitch||1;
 const v=voices.filter(x=>x.lang&&x.lang.replace("_","-").startsWith(u.lang.slice(0,2)));const exact=v.filter(x=>x.lang.replace("_","-")===u.lang);const pool=exact.length?exact:v;
 if(pool.length){u.voice=pool[(pitch&&pitch>1&&pool.length>1)?1:0]}
 u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
const TS=window.__TS||1;

/* ---------- 共通：Part2 / Part5 の出題データ ---------- */
function mkP2(x){const order=shuffle([0,1,2]);const cs=order.map(k=>x.ch[k]);
 return{q:x.q,cs,ans:order.indexOf(0),exp:x.exp,hide:true,audio:[{t:x.q,w:"M"}].concat(cs.map((c,i)=>({t:"ABC"[i]+". "+c,w:"W"})))}}
function mkP5(x){const order=shuffle([0,1,2,3]);return{q:x.q,cs:order.map(k=>x.ch[k]),ans:order.indexOf(0),exp:x.exp,hide:false}}
function mkP3(x,script,tag){const o=shuffle([0,1,2,3]);return{q:x.q,cs:o.map(k=>x.ch[k]),ans:o.indexOf(0),exp:x.exp,hide:false,script:true,audio:script,tag}}
function mkP7(x,passage,tag){const o=shuffle([0,1,2,3]);return{q:x.q,cs:o.map(k=>x.ch[k]),ans:o.indexOf(0),exp:x.exp,hide:false,p:passage,tag}}
function dailyItems(kind){const D=DAILY;if(!D)return[];const out=[];const all=kind==="all";
 if(all||kind==="p5")(D.p5||[]).forEach(x=>out.push(Object.assign(mkP5(x),{tag:"Part5"})));
 if(all||kind==="p2")(D.p2||[]).forEach(x=>out.push(Object.assign(mkP2(x),{tag:"Part2"})));
 if(all||kind==="p3")(D.p3||[]).forEach(c=>c.qs.forEach(x=>out.push(mkP3(x,c.script.map(l=>({t:l.t,w:l.w})),"Part3"))));
 if(all||kind==="p7")(D.p7||[]).forEach(c=>c.qs.forEach(x=>out.push(mkP7(x,c.passage,"Part7"))));
 return out}

 <button class="b o" onclick="dailyStart('all')">今日の問題を通しで（${c("all")}問）</button>

window.dailyStart=k=>{const it=dailyItems(k);if(it.length)tapQuiz("今日の問題",it,x=>x,it.length,true)};

window.setGap=v=>{st().set.gap=+v;save()};window.setRate=r=>{st().set.rate=r;save();train()};

/* ---------- 手ぶらモード ---------- */
function buildQueue(kind){
 const v=shuffle(VOC).map(d=>({t:"v",d})),p=shuffle(P2).map(x=>({t:"p",d:mkP2(x)})),h=shuffle(PH).map(d=>({t:"h",d}));
 if(kind==="vocab")return v;if(kind==="p2")return p;if(kind==="ph")return h;
 const out=[];const n=Math.max(v.length,p.length,h.length);
 for(let i=0;i<n;i++){if(v[i])out.push(v[i]);if(h[i])out.push(h[i]);if(p[i])out.push(p[i]);if(v[i+n])out.push(v[i+n])}return out}
const KIND={vocab:"単語",p2:"Part2 応答",ph:"シャドーイング",mix:"ミックス"};
function auto(kind){
 stopAll();keepAwake();let queue=buildQueue(kind),idx=0,paused=false;
 app.innerHTML=`<div class="top"><button onclick="train()">← 戻る</button><span class="stat">${KIND[kind]}</span><span class="stat" id="cnt">今日 ${st().days[today()]||0} 件</span></div>
 <div class="stage" id="stage"></div>
 <div class="bottom"><button class="b s" onclick="aPrev()">⏮</button><button class="b" id="pp" onclick="aToggle()">⏸ 一時停止</button><button class="b s" onclick="aNext()">⏭</button></div>`;
 const S=h=>{$("#stage").innerHTML=h};
 const chk=tk=>{if(tk!==run)throw 0};
 const gap=()=>st().set.gap;
 async function play(it,tk){
  if(it.t==="v"){const d=it.d;S(`<span class="tag">単語</span><div class="big">${d.w}</div><div><span class="pos">${d.p}</span></div>`);
   await say(d.w);chk(tk);await sleep(3000*gap()/1.5);chk(tk);
   S(`<span class="tag">単語</span><div class="big">${d.w}</div><div><span class="pos">${d.p}</span></div><div class="mid">${d.m}</div>`);await say(d.m,"ja-JP");chk(tk);
   S(`<span class="tag">単語</span><div class="big">${d.w}</div><div><span class="pos">${d.p}</span></div><div class="mid">${d.m}</div><div class="sub">${d.e}</div><div class="stat">${d.j}</div>${d.n?`<div class="stat">💡 ${d.n}</div>`:""}`);await say(d.e);chk(tk);await sleep(900)}
  else if(it.t==="h"){const d=it.d;S(`<span class="tag">シャドーイング</span><div class="q">${d.e}</div><div class="stat">🗣 聞いたあと、声に出して真似しよう</div>`);
   await say(d.e);chk(tk);await sleep(Math.max(2500,d.e.length*85)*gap()/1.5);chk(tk);
   S(`<span class="tag">シャドーイング</span><div class="q">${d.e}</div><div class="mid">${d.j}</div>`);await say(d.j,"ja-JP");chk(tk);await say(d.e);chk(tk);await sleep(700)}
  else{const d=it.d;S(`<span class="tag">Part2 応答</span><div class="mid">🎧 聞いて、A・B・Cのどれか考えよう</div>`);
   for(const l of d.audio){await say(l.t,"en-US",pitchOf(l.w));chk(tk);await sleep(350)}
   await sleep(3500*gap()/1.5);chk(tk);
   const L="ABC"[d.ans];
   S(`<span class="tag">Part2 応答</span><div class="q">${d.q}</div><div class="mid" style="text-align:left">${d.cs.map((c,i)=>(i===d.ans?"✅ ":"　")+"ABC"[i]+". "+c).join("<br>")}</div><div class="exp">${d.exp}</div>`);
   await say("The answer is "+L+". "+d.cs[d.ans],"en-US",1);chk(tk);await sleep(900)}}
 async function go(){const tk=++run;try{while(tk===run){await play(queue[idx],tk);bump();idx++;if(idx>=queue.length){queue=buildQueue(kind);idx=0}}}catch(e){}}
 window.aToggle=()=>{paused=!paused;$("#pp").textContent=paused?"▶ 再開":"⏸ 一時停止";if(paused)stopAll();else go()};
 window.aNext=()=>{stopAll();idx=(idx+1)%queue.length;if(!paused)go();else{paused=false;$("#pp").textContent="⏸ 一時停止";go()}};
 window.aPrev=()=>{stopAll();idx=(idx-1+queue.length)%queue.length;paused=false;$("#pp").textContent="⏸ 一時停止";go()};
 go()}

/* ---------- タップ：単語カード（間隔反復） ---------- */
function tapVocab(cat){stopAll();const POOL=(cat&&cat!=="全部")?VOC.filter(d=>d.c===cat):VOC;let cur=null,flip=false,last=-1,seen=0,known=0;
 function pick(){const s=st();const w=POOL.map((d,i)=>i===last?0:(5-(s.srs[d.w]||0))**2);const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,i=0;for(;i<w.length-1;i++){r-=w[i];if(r<=0)break}last=i;return POOL[i]}
 function draw(){const box=st().srs[cur.w]||0;
  app.innerHTML=`<div class="top"><button onclick="train()">← 戻る</button><span class="stat">単語カード</span><span class="stat" id="cnt">今日 ${st().days[today()]||0} 件</span></div>
  <div class="stage" onclick="vFlip()"><div class="stat">習熟度 ${"★".repeat(box)+"☆".repeat(4-box)}｜${cur.c}</div><div class="big">${cur.w}</div><div><span class="pos">${cur.p}</span></div>
  ${flip?`<div class="mid">${cur.m}</div><div class="sub">${cur.e}</div><div class="stat">${cur.j}</div>${cur.n?`<div class="stat">💡 ${cur.n}</div>`:""}`:`<div class="stat">画面をタップで意味を表示（先に思い出そう）</div>`}</div>
  <div class="bottom">${flip?`<button class="b s" onclick="vAns(false)">もう一度</button><button class="b g" onclick="vAns(true)">覚えた</button>`:`<button class="b s" onclick="vSpeak()">🔊 発音</button><button class="b" onclick="vFlip()">答えを見る</button>`}</div>`}
 window.vFlip=()=>{if(!flip){flip=true;draw();say(cur.w).then(()=>{if(flip)say(cur.e)})}};
 window.vSpeak=()=>{stopAll();say(cur.w)};
 window.vAns=k=>{stopAll();const s=st();s.srs[cur.w]=k?Math.min(4,(s.srs[cur.w]||0)+1):0;bump();seen++;if(k)known++;cur=pick();flip=false;draw();say(cur.w)};
 cur=pick();draw();say(cur.w)}

window.wbOpen=i=>{const e=$("#wd"+i);if(e){e.style.display=e.style.display==="none"?"block":"none"}stopAll();say(VOC[i].w).then(()=>say(VOC[i].e))};

/* ---------- タップ：Part2 / Part5 ---------- */
function tapQuiz(title,bank,mk,n,ordered){stopAll();const items=(ordered?bank.slice(0,n):shuffle(bank).slice(0,n)).map(mk);let i=0,score=0,done=false;
 function play(it){if(!it.audio)return;const tk=++run;try{speechSynthesis.cancel()}catch(e){}
  (async()=>{await sleep(150);for(const l of it.audio){if(tk!==run)return;await say(l.t,"en-US",pitchOf(l.w));await sleep(250)}})()}
 function show(){done=false;const it=items[i];
  app.innerHTML=`<div class="top"><button onclick="train()">← 戻る</button><span class="stat">${it.tag||title} ${i+1}/${items.length}</span><span class="stat" id="cnt">今日 ${st().days[today()]||0} 件</span></div>
  <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
  <div class="stage" style="margin-top:8px">${it.p?`<div class="passage">${it.p}</div>`:""}<div id="qt">${it.hide?'<div class="mid">🎧 聞いて、最も適切な応答を選ぼう</div>':`<div class="q">${it.q}</div>`}</div><div id="fb"></div></div>
  <div class="bottom" id="bt">${it.cs.map((c,k)=>`<button class="ch" onclick="tPick(${k})">${it.hide?"ABC"[k]:"ABCD"[k]+". "+c}</button>`).join("")}${it.audio?`<button class="b s" style="flex:1 1 100%;min-height:48px" onclick="tReplay()">🔁 もう一度聞く</button>`:""}</div>`;
  play(it)}
 window.tapQuizAgain=()=>tapQuiz(title,bank,mk,n,ordered);
 window.tReplay=()=>play(items[i]);
 window.tPick=k=>{if(done)return;done=true;stopAll();const it=items[i];const ok=k===it.ans;if(ok)score++;bump();
  document.querySelectorAll(".ch").forEach((b,idx)=>{b.textContent="ABCD"[idx]+". "+it.cs[idx];if(idx===it.ans)b.classList.add("ok");else if(idx===k)b.classList.add("ng")});
  if(it.hide){$("#qt").innerHTML=`<div class="q">${it.q}</div>`}
  $("#fb").innerHTML=`<div class="exp">${ok?"⭕ 正解！":"❌ 不正解（正解は "+"ABCD"[it.ans]+"）"}\n${it.exp}${it.script?"\n\n【スクリプト】\n"+it.audio.map(l=>l.t).join("\n"):""}</div>`;
  $("#bt").innerHTML=`<button class="b" onclick="tNext()">${i+1<items.length?"次へ →":"結果を見る"}</button>`};
 window.tNext=()=>{i++;if(i<items.length)show();else{app.innerHTML=`<div class="card" style="text-align:center"><h2>結果</h2><div style="font-size:2.6rem;font-weight:800">${score} / ${items.length}</div><div class="stat">${score/items.length>=.8?"いい調子です！":"間違えた問題は、もう一度挑戦しよう。"}</div></div><div class="bottom"><button class="b s" onclick="train()">ホーム</button><button class="b" onclick="tapQuizAgain()">もう一度</button></div>`}};
 show()}
/* ---------- トップ：使う場面を選ぶ ---------- */
const dk=on=>{try{document.body.classList.toggle("dark",on)}catch(e){}};
function home(){stopAll();dk(false);const s=st();const n=s.days[today()]||0;
 app.innerHTML=`<h1>TOEIC 移動中トレーニング</h1>
 <div class="card"><div class="stat">今日の学習：<b>${n}</b> 件 ／ 連続 <b>${streak()}</b> 日</div></div>
 <button class="b hero" onclick="train()">🚃 電車・バス<small>スマホを触れる（画面を見ながら／タップ操作）</small></button>
 <button class="b hero o" onclick="driveMenu()">🚗 運転中（営業車）<small>音声だけ・手ぶら／シャドーイングOK</small></button>
 <div class="card stat">場面に合わせて内容と操作を切り替えます。運転中は、出発前に設定して、スマホを固定してから走り出してください。</div>`}

/* ---------- 運転モード（音声のみ） ---------- */
function driveMenu(){stopAll();dk(true);const s=st();
 app.innerHTML=`<div class="top"><button onclick="home()">← 戻る</button><span class="stat">🚗 運転モード</span><span></span></div>
 <div class="card"><h2>音声だけで進む学習プログラム</h2>
  <div class="stat" style="line-height:1.7">単語 → シャドーイング → Part2 → Part5 を、日本語の案内つきで自動でくり返します。声に出すタイミングは「ピッ」という音でお知らせします。</div></div>
 <div class="card"><label>学習時間</label>
  <select id="dmin"><option value="20">20分</option><option value="40" selected>40分</option><option value="60">60分</option><option value="90">90分</option></select>
  <div style="margin-top:10px"><label>声に出す・考える間（ま）</label>
  <select onchange="setGap(this.value)"><option value="1" ${s.set.gap==1?"selected":""}>短め</option><option value="1.5" ${s.set.gap==1.5?"selected":""}>ふつう</option><option value="2.2" ${s.set.gap==2.2?"selected":""}>長め（シャドーイングしやすい）</option></select></div>
  <div style="margin-top:10px"><label>英語の読み上げ速度</label><div class="rate">${[.8,1,1.2].map(r=>`<button class="${s.set.rate==r?"on":""}" onclick="setRate2(${r})">${r}x</button>`).join("")}</div></div></div>
 <div class="note">⚠ 安全のため：出発前にスタートを押し、スマホは固定してください。走行中は画面の操作や注視をしないでください。音声だけで進みます。</div>
 <div class="note" style="margin-top:8px">ℹ 画面がロックされると音声が止まる端末があります。スマホは充電しながら、画面をつけたまま（このアプリを前面に）にしておくと安定します。</div>
 <div class="bottom"><button class="b o" style="min-height:76px;font-size:1.2rem" onclick="drive(+$('#dmin').value)">▶ スタート</button></div>`}
window.setRate2=r=>{st().set.rate=r;save();driveMenu()};
let ac=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch(e){}return sleep(250)}
const DBLOCKS=[["v",5,"単語です。英語を聞いて、意味を思い出してください。"],["h",5,"シャドーイングです。英語を聞いたあと、ピッという音のあとに、続けて声に出してください。"],["p",3,"Part2、応答問題です。質問と3つの答えを聞いて、正しい答えを選んでください。"],["q",3,"Part5、文法問題です。空所に入る言葉を選んでください。"],["c",1,"Part3、会話問題です。会話を聞いて、質問に答えてください。"]];
const LABEL={v:"単語",h:"シャドーイング",p:"Part2 応答",q:"Part5 文法",c:"Part3 会話"};
function drive(min){
 stopAll();dk(true);keepAwake();
 const queues={};const conv=()=>{const d=(DAILY&&DAILY.p3||[]).map(c=>({script:c.script,qs:c.qs}));return d.length?d:[{script:c1,qs:[P3[0],P3[1]]},{script:c2,qs:[P3[2],P3[3]]}]};
 const mk={v:()=>shuffle(VOC),h:()=>shuffle(PH),p:()=>dailyItems("p2").concat(shuffle(P2).map(mkP2)),q:()=>dailyItems("p5").concat(shuffle(P5).map(mkP5)),c:()=>shuffle(conv())};
 const nextItem=t=>{if(!queues[t]||!queues[t].length)queues[t]=mk[t]();return queues[t].shift()};
 let bi=0,ni=0,announced=false,paused=false,el=0,last=Date.now(),done=0;
 const used=()=>el+(paused?0:Date.now()-last);
 app.innerHTML=`<div class="top"><span class="stat">🚗 運転モード</span><span class="stat" id="dt">0 / ${min} 分</span></div>
 <div class="stage" id="stage"></div>
 <div class="bottom"><button class="b s" style="background:#1e293b;color:#e5e7eb" id="dpp" onclick="dToggle()">⏸ 一時停止</button><button class="b s" style="background:#1e293b;color:#e5e7eb" onclick="dSkip()">⏭ 次へ</button><button class="b" style="background:#991b1b" onclick="dStop()">■ 終了</button></div>`;
 const S=h=>{const e=$("#stage");if(e)e.innerHTML=h};
 const chk=tk=>{if(tk!==run)throw 0};
 const G=()=>st().set.gap;
 const tick=()=>{const e=$("#dt");if(e)e.textContent=Math.floor(used()/60000)+" / "+min+" 分"};
 async function playD(t,it,tk){
  if(t==="v"){S(`<span class="tag">単語</span><div class="big">${it.w}</div>`);
   await say(it.w);chk(tk);await sleep(2600*G()/1.5);chk(tk);
   S(`<span class="tag">単語</span><div class="big">${it.w}</div><div class="mid">${it.m}</div>`);await say(it.m,"ja-JP");chk(tk);await say(it.w);chk(tk);
   S(`<span class="tag">単語</span><div class="big">${it.w}</div><div class="mid">${it.m}</div><div class="sub">${it.e}</div>`);await say(it.e);chk(tk);await sleep(600)}
  else if(t==="h"){const gap=Math.max(2600,it.e.length*90)*G()/1.5;
   S(`<span class="tag">シャドーイング</span><div class="q">${it.e}</div>`);await say(it.e);chk(tk);
   await beep();chk(tk);await sleep(gap);chk(tk);
   S(`<span class="tag">シャドーイング</span><div class="q">${it.e}</div><div class="mid">${it.j}</div>`);await say(it.j,"ja-JP");chk(tk);
   await say(it.e);chk(tk);await beep();chk(tk);await sleep(gap);chk(tk);await sleep(400)}
  else if(t==="p"){S(`<span class="tag">Part2</span><div class="mid">🎧 聞いて、A・B・Cを選ぼう</div>`);
   for(const l of it.audio){await say(l.t,"en-US",pitchOf(l.w));chk(tk);await sleep(300)}
   await sleep(3200*G()/1.5);chk(tk);
   S(`<span class="tag">Part2</span><div class="q">${it.q}</div><div class="mid" style="text-align:left">${it.cs.map((c,i)=>(i===it.ans?"✅ ":"　")+"ABC"[i]+". "+c).join("<br>")}</div>`);
   await say("The answer is "+"ABC"[it.ans]+". "+it.cs[it.ans]);chk(tk);await sleep(600)}
  else if(t==="c"){S(`<span class="tag">Part3</span><div class="mid">🎧 会話を聞こう</div>`);
   for(const l of it.script){await say(l.t,"en-US",pitchOf(l.w));chk(tk);await sleep(250)}
   for(const x of it.qs){const o=shuffle([0,1,2,3]);const cs=o.map(k=>x.ch[k]),ans=o.indexOf(0);
    S(`<span class="tag">Part3</span><div class="q">${x.q}</div>`);await sleep(500);chk(tk);
    await say(x.q);chk(tk);for(let i=0;i<4;i++){await say("ABCD"[i]+". "+cs[i]);chk(tk);await sleep(200)}
    await sleep(3500*G()/1.5);chk(tk);
    S(`<span class="tag">Part3</span><div class="q">${x.q}</div><div class="mid" style="text-align:left">${cs.map((c,i)=>(i===ans?"✅ ":"　")+"ABCD"[i]+". "+c).join("<br>")}</div><div class="exp" style="background:#422006;color:#fde68a">${x.exp}</div>`);
    await say("The answer is "+"ABCD"[ans]+". "+cs[ans]);chk(tk);await sleep(600)}}
  else{const blank=it.q.replace("___","blank");S(`<span class="tag">Part5</span><div class="q">${it.q}</div>`);
   await say(blank);chk(tk);await sleep(250);
   for(let i=0;i<4;i++){await say("ABCD"[i]+". "+it.cs[i]);chk(tk);await sleep(250)}
   await sleep(3500*G()/1.5);chk(tk);
   S(`<span class="tag">Part5</span><div class="q">${it.q.replace("___","<u>"+it.cs[it.ans]+"</u>")}</div><div class="exp" style="background:#422006;color:#fde68a">${it.exp}</div>`);
   await say("The answer is "+"ABCD"[it.ans]+". "+it.q.replace("___",it.cs[it.ans]));chk(tk);await say(it.exp,"ja-JP");chk(tk);await sleep(600)}}
 async function finish(tk){S(`<div class="big">🎉</div><div class="mid">お疲れさまでした。<br>${done} 問 学習しました</div>`);
  await say("時間になりました。お疲れさまでした。今日は "+done+" 問、学習しました。","ja-JP")}
 async function go(){const tk=++run;last=Date.now();
  try{while(tk===run){tick();if(used()>=min*60000){await finish(tk);return}
   const b=DBLOCKS[bi];
   if(ni===0&&!announced){announced=true;S(`<span class="tag">${LABEL[b[0]]}</span><div class="mid">${b[2]}</div>`);await say(b[2],"ja-JP");chk(tk);await sleep(500);chk(tk)}
   const it=nextItem(b[0]);await playD(b[0],it,tk);bump();done++;ni++;
   if(ni>=b[1]){ni=0;announced=false;bi=(bi+1)%DBLOCKS.length}}}catch(e){}}
 window.dToggle=()=>{if(!paused){el+=Date.now()-last;paused=true;stopAll();$("#dpp").textContent="▶ 再開"}else{paused=false;$("#dpp").textContent="⏸ 一時停止";go()}};
 window.dSkip=()=>{if(paused){paused=false;$("#dpp").textContent="⏸ 一時停止"}else{el+=Date.now()-last}stopAll();ni=0;announced=false;bi=(bi+1)%DBLOCKS.length;go()};
 window.dStop=()=>{stopAll();home()};
 go()}
loadDaily();
(function(){const m=new URLSearchParams(location.search).get("m");
 const meta={train:["TOEIC 電車","icons/train-180.png","icons/train.png"],drive:["TOEIC 運転","icons/drive-180.png","icons/drive.png"]}[m];
 if(meta){document.title=meta[0];try{$("#ati").href=meta[1];document.querySelector('link[rel="icon"]').href=meta[2];const a=document.createElement("meta");a.name="apple-mobile-web-app-title";a.content=meta[0];document.head.appendChild(a)}catch(e){}}
 if(m==="drive")driveMenu();else if(m==="train")train();else home()})();
</script></body></html>
